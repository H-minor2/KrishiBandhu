<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krishi Bandhu — Farmer Distress</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7f5;color:#172019}
header{background:#173d25;color:white;padding:22px 28px}
main{max-width:1100px;margin:24px auto;padding:0 18px}
.card{background:white;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 2px 12px #0001}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
input{width:100%;padding:10px;box-sizing:border-box;border:1px solid #ccd5cd;border-radius:8px}
button{padding:12px 18px;border:0;border-radius:8px;background:#206b35;color:white;font-weight:bold;cursor:pointer}
.result{font-size:44px;font-weight:bold}
.component{border-top:1px solid #eee;padding:14px 0}
.small{color:#5d6960;font-size:13px}
pre{white-space:pre-wrap;background:#111;color:#eee;padding:15px;border-radius:8px;overflow:auto}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>Krishi Bandhu</h1>
<div>Live Farmer Distress Decision-Support Dashboard</div>
</header>
<main>
<div class="card">
<h2>Farmer information</h2>
<div class="grid">
<label>Farmer ID<input id="farmer_id" value="F001"></label>
<label>State<input id="state" value="Odisha"></label>
<label>District<input id="district" value="Bhubaneswar"></label>
<label>Latitude<input id="lat" type="number" step="0.0001" value="20.2961"></label>
<label>Longitude<input id="lon" type="number" step="0.0001" value="85.8245"></label>
<label>Crop<input id="crop" value="rice"></label>
<label>Market<input id="market" value="Bhubaneswar"></label>
<label>Area (acres)<input id="area" type="number" step="0.1" value="2.5"></label>
<label>Loan amount<input id="loan_amount" type="number" value="100000"></label>
<label>Outstanding amount<input id="outstanding" type="number" value="40000"></label>
<label>Loan due date<input id="due" type="date" value="2026-09-01"></label>
</div>
<br>
<button onclick="predict()">Calculate live distress</button>
<p class="small">First request may be slower because upstream data is fetched and cached. Later requests reuse cached data until TTL expiry.</p>
</div>

<div id="output"></div>
</main>
<script>
async function predict(){
 const out=document.getElementById("output");
 out.innerHTML='<div class="card">Fetching live weather and mandi data…</div>';
 const body={
  farmer_id:document.getElementById("farmer_id").value,
  location:{
   state:document.getElementById("state").value,
   district:document.getElementById("district").value,
   latitude:Number(document.getElementById("lat").value),
   longitude:Number(document.getElementById("lon").value)
  },
  crop:{
   name:document.getElementById("crop").value,
   area_acres:Number(document.getElementById("area").value)
  },
  market:{name:document.getElementById("market").value},
  loans:[{
   loan_id:"L001",
   amount:Number(document.getElementById("loan_amount").value),
   outstanding_amount:Number(document.getElementById("outstanding").value),
   due_date:document.getElementById("due").value,
   status:"active"
  }]
 };
 try{
  const r=await fetch("/distress/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const data=await r.json();
  if(!r.ok) throw new Error(JSON.stringify(data));
  let html=`<div class="card"><div class="small">DISTRESS SCORE</div><div class="result">${data.distress_score}/100</div><h2>${data.risk_level}</h2></div>`;
  html+='<div class="card"><h2>Risk components</h2>';
  for(const [name,c] of Object.entries(data.components)){
   html+=`<div class="component"><h3>${name.toUpperCase()} — ${c.score}/100</h3>
   <div>${c.explanation}</div>
   <div class="small">Weight ${c.weight} · Contribution ${c.contribution} · Data quality ${c.data_quality}</div>
   <pre>${JSON.stringify(c.data,null,2)}</pre></div>`;
  }
  html+='</div><div class="card"><h2>Reasons</h2><ul>'+data.reasons.map(x=>`<li>${x}</li>`).join("")+'</ul></div>';
  html+=`<div class="card"><h2>Metadata</h2><pre>${JSON.stringify(data.metadata,null,2)}</pre></div>`;
  out.innerHTML=html;
 }catch(e){
  out.innerHTML=`<div class="card"><h2>Request failed</h2><pre>${e}</pre></div>`;
 }
}
</script>
</body>
</html>
